name: Phase 2 - Verify Central Schema

on:
  push:
    branches: [feat/v3-next, feat/v6-finance-ui]
  pull_request:
    branches: [feat/v3-next, feat/v6-finance-ui]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify:phase2-storage-schema
      - run: npm run build
