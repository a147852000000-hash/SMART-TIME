name: Oracle Unification Auth and Build Gate

on:
  pull_request:
    branches:
      - main
      - fix/owner-role-reset-settings
  push:
    branches:
      - feat/oracle-json-sqlite-unification
      - fix/owner-admin-account-management

jobs:
  auth-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:password-reset-email
      - run: npm run test:auth-security
      - run: npm run test:startup-storage
      - run: npm run test:owner-promotion-sql
      - run: npm run test:turnstile
      - run: npm run test:legacy-json-migration
      - run: bash -n scripts/oracle-sqlite-backup.sh scripts/oracle-sqlite-restore-test.sh scripts/oracle-sqlite-backup-retention.sh
      - run: npm run lint
      - run: npm run build
