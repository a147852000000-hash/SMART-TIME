name: Phase 5.5 - AI Canonical Finance Verification

on:
  push:
    branches: [feat/v3-next, feat/v6-finance-ui]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Phase 5.5 AI canonical reads
        run: npm run verify:phase5-ai-canonical
      - name: Verify Phase 5.4 migration
        run: npm run verify:phase5-finance-migration
      - name: Build
        run: npm run build
