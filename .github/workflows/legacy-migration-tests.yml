name: Legacy JSON Migration Tests

on:
  pull_request:
    branches:
      - main
      - fix/owner-role-reset-settings
      - fix/owner-admin-account-management
  push:
    branches:
      - feat/oracle-json-sqlite-unification
      - fix/owner-admin-account-management
      - fix/owner-admin-single-owner-no-gift-finance

jobs:
  legacy-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:legacy-json-migration
