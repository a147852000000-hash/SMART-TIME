services:
  smart-ai-trainer:
    build:
      context: ../..
      dockerfile: infra/smart-ai/training/Dockerfile
    gpus: all
    environment:
      BASE_MODEL: ${BASE_MODEL:-Qwen/Qwen3-4B}
      OUTPUT_DIR: /workspace/infra/smart-ai/training/output
      EPOCHS: ${EPOCHS:-3}
      BATCH_SIZE: ${BATCH_SIZE:-2}
      GRADIENT_ACCUMULATION_STEPS: ${GRADIENT_ACCUMULATION_STEPS:-8}
      LEARNING_RATE: ${LEARNING_RATE:-2e-4}
      MAX_LENGTH: ${MAX_LENGTH:-1024}
      USE_LORA: ${USE_LORA:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models-cache
      HUGGINGFACE_HUB_CACHE: /models-cache/hub
      TRANSFORMERS_CACHE: /models-cache/transformers
    volumes:
      - smart-ai-model-cache:/models-cache
      - smart-ai-output:/workspace/infra/smart-ai/training/output
    shm_size: "16gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["infra/smart-ai/training/train_smart_ai.py"]

volumes:
  smart-ai-model-cache:
  smart-ai-output:
