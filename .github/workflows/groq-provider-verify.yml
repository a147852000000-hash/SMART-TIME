name: Groq Provider Contract Verify

on:
  push:
    branches: [feat/v3-next]
    paths:
      - "backend/ai/providers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/groq-provider-verify.yml"
  pull_request:
    branches: [feat/v3-next]
    paths:
      - "backend/ai/providers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/groq-provider-verify.yml"

jobs:
  groq-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:groq-provider
      - run: npm run lint
