name: Password Reset Auth Verify

on:
  push:
    branches: [main]
    paths:
      - "server.ts"
      - "src/components/AuthView.tsx"
      - "src/components/SettingsAndBackupModal.tsx"
      - "src/services/authService.ts"
      - "backend/auth/**"
      - "backend/database.ts"
      - "package.json"
      - ".env.example"
      - ".github/workflows/password-reset-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "server.ts"
      - "src/components/AuthView.tsx"
      - "src/services/authService.ts"
      - "backend/auth/**"
      - "backend/database.ts"
      - "package.json"
      - ".env.example"
      - ".github/workflows/password-reset-verify.yml"

jobs:
  password-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:password-reset-email
      - run: npm run lint
      - run: npm run build
