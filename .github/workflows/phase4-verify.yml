name: Phase 4 - Verify Storage Adapter

on:
  push:
    branches: [feat/v3-next, feat/v6-finance-ui]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Phase 4 storage adapter
        run: npm run verify:phase4-no-direct-storage
      - name: Build
        run: npm run build
