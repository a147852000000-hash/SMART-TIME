name: Phase 5.6 - Verify Duplicate Write Removal

on:
  push:
    branches: [feat/v3-next, feat/v6-finance-ui]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Phase 5.6
        run: npm run verify:phase5-no-duplicate-writes
      - name: Build
        run: npm run build

# Phase 5.6 gate runs on every feat/v3-next push.
