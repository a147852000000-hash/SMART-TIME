name: storage-inventory-discovery

on:
  push:
    branches: ["feat/v3-next"]
    paths:
      - "src/**"
      - "scripts/scan-hidden-storage.js"
      - ".github/workflows/storage-inventory-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run storage discovery
        run: node scripts/scan-hidden-storage.js
      - name: Commit discovery map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/STORAGE-DISCOVERED-V2.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
            exit 0
          fi
          git commit -m "docs(ai): update storage discovery map"
          git push