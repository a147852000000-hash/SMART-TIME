services:
  smart-ai-inference:
    image: vllm/vllm-openai:latest
    restart: unless-stopped

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

    ports:
      - "8000:8000"

    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - ./training/output:/app/adapter:ro

    ipc: host

    command:
      - --model
      - ${SMART_AI_MODEL}
      - --served-model-name
      - ${SMART_AI_LOCAL_MODEL:-smart-time-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${SMART_AI_MAX_MODEL_LEN:-4096}
      - --enable-lora
      - --max-lora-rank
      - "16"
      - --lora-modules
      - smart-time-local=/app/adapter
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
