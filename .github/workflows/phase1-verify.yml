name: Phase 1 - Requirements Traceability

on:
  push:
    branches: [phase/01-requirements-traceability]
  pull_request:
    branches: [feat/v3-next]

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Phase 1 requirements gate
        run: node scripts/verify-phase1-requirements.mjs

      - name: Type check
        run: npm run lint

      - name: Existing AI tests
        run: npm run test:open-mind

      - name: Production build
        run: npm run build
